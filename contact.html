<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="Generator" content="Drupal 11 (https://www.drupal.org)" />
    <meta name="MobileOptimized" content="width" />
    <meta name="HandheldFriendly" content="true" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="/core/misc/favicon.ico"
      type="image/vnd.microsoft.icon"
    />

    <title>Contact Us | PT WAHANA CIPTASINATRIA</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/contact-form.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body class="wcs-theme">
    <link rel="icon" id="dynamic-favicon" type="image/svg+xml" />

    <div id="header-placeholder"></div>
    <script src="js/header.js"></script>

    <main id="main-content" class="main-content">
      <div>
        <div
          id="block-wcs-theme-content"
          class="block--system_main_block block--region--content"
        >
          <div class="contact-hero-banner">
            <div class="contact-hero-content">
              <h1 class="contact-hero-title">Let's Work Together</h1>
              <p class="contact-hero-description">
                Reach out to our team for more information about our solutions,
                services,<br />
                or partnership opportunities. We are ready to assist you with
                your business needs.
              </p>
            </div>
          </div>

          <div class="contact-us-wrapper">
            <div class="contact-us-container">
              <div class="contact-form-section">
                <div class="contact-form-wrapper">
                  <form
                    class="wcs-theme-contact-form contact-us-form wcs-form contact-form"
                    id="contact-us-form"
                    data-drupal-selector="wcs-theme-contact-form"
                    action="/contact"
                    method="post"
                    accept-charset="UTF-8"
                  >
                    <div
                      class="js-form-item form-item form-type-textfield js-form-type-textfield form-item-full-name js-form-item-full-name"
                    >
                      <label
                        for="edit-full-name"
                        >Full Name</label
                      >

                      <input
                        placeholder="Insert your full name"
                        class="contact-form-field contact-form-full-name form-text required"
                        data-drupal-selector="edit-full-name"
                        type="text"
                        id="edit-full-name"
                        name="full_name"
                        value=""
                        size="60"
                        maxlength="255"
                        required="required"
                      />
                    </div>

                    <div
                      class="js-form-item form-item form-type-email js-form-type-email form-item-email js-form-item-email"
                    >
                      <label
                        for="edit-email"
                        >Email</label
                      >

                      <input
                        placeholder="Insert your email address"
                        class="contact-form-field contact-form-email form-email required"
                        data-drupal-selector="edit-email"
                        type="email"
                        id="edit-email"
                        name="email"
                        value=""
                        size="60"
                        maxlength="255"
                        required="required"
                      />
                    </div>

                    <div
                      class="js-form-item form-item form-type-tel js-form-type-tel form-item-phone-number js-form-item-phone-number"
                    >
                      <label
                        for="edit-phone-number"
                        >Phone Number</label
                      >

                      <input
                        placeholder="Insert your phone number"
                        class="contact-form-field contact-form-phone form-tel required"
                        data-drupal-selector="edit-phone-number"
                        type="tel"
                        id="edit-phone-number"
                        name="phone_number"
                        value=""
                        size="30"
                        maxlength="50"
                        required="required"
                      />
                    </div>

                    <div
                      class="js-form-item form-item form-type-textfield js-form-type-textfield form-item-company-name js-form-item-company-name"
                    >
                      <label for="edit-company-name">Company Name</label>

                      <input
                        placeholder="Insert your company name"
                        class="contact-form-field contact-form-company form-text"
                        data-drupal-selector="edit-company-name"
                        type="text"
                        id="edit-company-name"
                        name="company_name"
                        value=""
                        size="60"
                        maxlength="255"
                      />
                    </div>

                    <div
                      class="js-form-item form-item form-type-select js-form-type-select form-item-product-interest js-form-item-product-interest"
                    >
                      <label
                        for="edit-product-interest"
                        >Product Interest</label
                      >

                      <select
                        class="contact-form-field contact-form-product-interest form-select required"
                        data-drupal-selector="edit-product-interest"
                        id="edit-product-interest"
                        name="product_interest"
                        required="required"
                      >
                        <option value="" selected>- Select -</option>
                        <option value="network_infrastructure">
                          Network and Infrastructure Solutions
                        </option>
                        <option value="security_solutions">
                          Security Solutions
                        </option>
                        <option value="service_solution">
                          Service Solution
                        </option>
                        <option value="application_non_erp">
                          Application Non-ERP
                        </option>
                        <option value="electronic_security">
                          Electronic Security System
                        </option>
                      </select>
                    </div>

        

                    <div
                      class="js-form-item form-item form-type-textarea js-form-type-textarea form-item-message js-form-item-message"
                    >
                      <label for="edit-message">Tell us Anything</label>

                      <div>
                        <textarea
                          placeholder="Describe your company's plan, size and plan to implement"
                          class="contact-form-field contact-form-message form-textarea resize-vertical"
                          data-drupal-selector="edit-message"
                          aria-describedby="edit-message--description"
                          id="edit-message"
                          name="message"
                          rows="5"
                          cols="60"
                          maxlength="5000"
                        ></textarea>
                      </div>

                      <div id="edit-message--description" class="description">
                        Maximum 5000 characters
                      </div>
                    </div>

                    <div
                      class="js-form-item form-item form-type-checkbox js-form-type-checkbox form-item-privacy-accepted js-form-item-privacy-accepted"
                    >
                      <input
                        class="contact-form-field contact-form-privacy form-checkbox required"
                        data-drupal-selector="edit-privacy-accepted"
                        type="checkbox"
                        id="edit-privacy-accepted"
                        name="privacy_accepted"
                        value="1"
                        required="required"
                      />

                      <label
                        for="edit-privacy-accepted"
                        class="option"
                        >I have read and agree to the <a href="#" style="text-decoration:underline;">Privacy Statement</a>. PT WAHANA CIPTASINATRIA</label
                      >
                    </div>

                    <input
                      autocomplete="off"
                      data-drupal-selector="form-9fuxeztkzw-991gnwfo6lxfzbzw92muaiv99u2e83lc"
                      type="hidden"
                      name="form_build_id"
                      value="form-9FuXeZtkzW-991gNwfo6LxfzBzw92MuAiV99U2e83Lc"
                    />

                    <input
                      data-drupal-selector="edit-wcs-theme-contact-form"
                      type="hidden"
                      name="form_id"
                      value="wcs_theme_contact_form"
                    />

                    <div
                      data-drupal-selector="edit-actions"
                      class="form-actions js-form-wrapper form-wrapper"
                      id="edit-actions"
                    >
                      <button
                        class="contact-form-submit btn btn-primary button js-form-submit form-submit"
                        data-drupal-selector="edit-submit"
                        type="submit"
                        id="edit-submit"
                        name="op"
                      >
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px;">
                          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                          <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        Send Message
                      </button>
                    </div>
                  </form>
                </div>
              </div>

              <div class="contact-info-section">
                <div class="contact-info-item contact-phones">
                  <div class="contact-info-icon">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewbox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
                      ></path>
                    </svg>
                  </div>
                  <div class="contact-info-details">
                    <h3 class="contact-info-label">Telepon</h3>
                    <a href="tel:+622150924120" class="contact-info-link">(021) 5092-4120</a>
                  </div>
                </div>

                <div class="contact-info-item contact-emails">
                  <div class="contact-info-icon">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewbox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                    >
                      <path
                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                      ></path>
                      <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                  </div>
                  <div class="contact-info-details">
                    <h3 class="contact-info-label">Email</h3>
                    <a href="mailto:contact@wcs.co.id" class="contact-info-link"
                      >contact@wcs.co.id</a
                    ><br />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="js/footer.js"></script>
  </body>
</html>
